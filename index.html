<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A polished test page.">
  <title>Test</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "Noto Sans Canadian Aboriginal", "Euphemia UCAS", "Gadugi", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
    }

    .lang-switch {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.25rem;
      background: var(--card);
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .lang-switch button {
      border: 0;
      cursor: pointer;
      font: inherit;
      color: var(--muted);
      background: transparent;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      transition: color 0.2s, background 0.2s;
    }

    .lang-switch button:hover { color: var(--text); }

    .lang-switch button[aria-pressed="true"] {
      color: #0f172a;
      background: var(--accent);
      font-weight: 600;
    }

    .lang-switch button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card {
      background: var(--card);
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 90vw;
      animation: rise 0.6s ease-out both;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    p.headline {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      margin: 0;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      color: var(--muted);
      margin: 0.75rem 0 0;
      font-size: 1rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <nav class="lang-switch" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="iu" aria-pressed="false" lang="iu">ᐃᓄᒃᑎᑐᑦ</button>
  </nav>

  <main class="card">
    <span class="badge" data-i18n="badge">Status</span>
    <p class="headline" data-i18n="headline">test</p>
    <p class="sub" data-i18n="sub">Everything is working as expected.</p>
  </main>

  <script>
    const I18N = {
      en: {
        badge: "Status",
        headline: "test",
        sub: "Everything is working as expected.",
      },
      iu: {
        badge: "ᖃᓄᐃᓕᖓᓂᖓ",
        headline: "ᖃᐅᔨᓴᕐᓂᖅ",
        sub: "ᑭᓱᑕᒫᑦ ᐱᓕᕆᐊᖃᖅᑐᑦ ᓂᕆᐅᒋᔭᐅᔪᑎᑐᑦ.",
      },
    };

    const SUPPORTED = Object.keys(I18N);
    const STORAGE_KEY = "lang";
    const buttons = document.querySelectorAll(".lang-switch button");
    const fields = document.querySelectorAll("[data-i18n]");

    function applyLang(lang) {
      if (!SUPPORTED.includes(lang)) lang = "en";
      const dict = I18N[lang];

      document.documentElement.lang = lang;
      fields.forEach((el) => {
        const key = el.dataset.i18n;
        if (dict[key] != null) el.textContent = dict[key];
      });
      buttons.forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });

      try {
        localStorage.setItem(STORAGE_KEY, lang);
      } catch (_) {
        /* storage unavailable — ignore */
      }
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.dataset.lang));
    });

    let saved = "en";
    try {
      saved = localStorage.getItem(STORAGE_KEY) || "en";
    } catch (_) {
      /* storage unavailable — fall back to default */
    }
    applyLang(saved);
  </script>
</body>
</html>
